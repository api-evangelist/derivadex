aid: derivadex
name: DerivaDEX
description: >-
  DerivaDEX is a decentralized cryptocurrency derivatives exchange for perpetual
  swaps, governed from day one by the DerivaDAO and its DDX token. It aims to pair
  the performance and usability of a centralized exchange with the custody and
  transparency of DeFi, using on-chain settlement, an insurance fund, trade
  mining, and a checkpointed price feed. DerivaDEX publishes a public REST API
  (exchange system and market-data endpoints plus protocol/stats aggregations)
  documented at docs.derivadex.io and exchange.derivadex.com/api-docs, an
  Authenticated REST API and a Realtime API, an on-chain explorer, and a
  governance app. Mainnet runs as a limited-access pilot on Ethereum with a
  public Sepolia testnet, and the exchange is licensed by the Bermuda Monetary
  Authority. Backed by Polychain Capital.
